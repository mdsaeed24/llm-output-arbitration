      designs sometimes get a novelty bump that fades.


      Taken together, the redesign is clearly responsible for the 12% increase, so
      you should roll the same design out to your mobile app as well.


      To measure the effect properly in future, run an A/B test that shows the old
      and new designs to randomly assigned visitors at the same time, and compare
      conversion rates rather than total sales.
