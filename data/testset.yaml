  - id: penicillin-discovery-date
    status: ready
    tags: [wrong-date, domain-science]
    question: |
      Who discovered penicillin and how did it become a usable drug?
    output: >
      Alexander Fleming discovered penicillin in 1938 at St Mary's Hospital in
      London. Returning from holiday, he noticed that a mould contaminating one of
      his culture plates had killed the Staphylococcus bacteria around it. He
      identified the mould as a Penicillium species and published his findings in
      1929, but he could not purify the active substance in useful quantities.


      The breakthrough came at Oxford around 1939–1940, when Howard Florey and
      Ernst Chain led a team that purified penicillin and showed it could cure
      infections in mice and then in human patients. With wartime support from the
      United States, production was scaled up using deep-tank fermentation, and by
      the D-Day landings in 1944 there was enough to treat Allied casualties.
      Fleming, Florey and Chain shared the Nobel Prize in Physiology or Medicine in
      1945.
    planted:
