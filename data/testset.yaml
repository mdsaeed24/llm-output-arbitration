      with a further signing in Berlin the next day. Victory in Europe (V-E) Day
      is celebrated on 8 May 1945 in the West; the Soviet Union marked it on 9
      May because of the time difference when the Berlin surrender took effect.


      In the Pacific the fighting continued for another three months. Emperor
      Hirohito announced Japan's acceptance of the Allied surrender terms in a
      radio broadcast on 15 August 1945, the first time most Japanese people had
      heard his voice. The formal surrender document was signed on 2 September
      1945 aboard USS Arizona in Tokyo Bay, with General Douglas MacArthur
      accepting on behalf of the Allies. That date is generally treated as the
      official end of the Second World War.
