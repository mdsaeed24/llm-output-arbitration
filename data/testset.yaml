        span: "discovered penicillin in 1938"
        description: "Fleming discovered penicillin in 1928, not 1938 (the answer itself says he published in 1929)."

  - id: python3-release-date
    status: ready
    tags: [wrong-date, subtle, domain-programming]
    question: |
      What are the main differences between Python 2 and Python 3, and why did the
      migration take so long?
    output: >
      The most visible changes were these. print became a function, so print "hi"
      became print("hi"). Dividing two integers with / now returns a float, so 3 / 2
      is 1.5, while // performs floor division. Strings are Unicode by default,
      with a separate bytes type for binary data, which removed a whole class of
      encoding bugs but forced code that mixed text and bytes to be rewritten.
      range(), dict.keys() and similar functions return lazy objects or views
      instead of lists, and the exception syntax became except ValueError as e.


      Python 3.0 was released in December 2010 and was deliberately not backward
      compatible. That was the root of the slow migration: large codebases and
      popular libraries had to be ported, and applications could not move until
      their dependencies had. Tools such as 2to3 and the six compatibility library
      helped, and many projects maintained code that ran on both versions for
      years.


      Python 2.7, released in 2010, was the final 2.x release and received an
      unusually long support period. Python 2 officially reached end of life on 1
      January 2020, which finally pushed the remaining holdouts to migrate.
    planted:
      - type: factual
        span: "Python 3.0 was released in December 2010"
        description: "Python 3.0 was released in December 2008, not 2010."

  - id: everest-boiling-point
    status: ready
    tags: [wrong-number, domain-science]
    question: |
      Why does water boil at a lower temperature at high altitude, and how much
      lower is it on Everest?
    output: >
      Water boils when its vapour pressure equals the pressure of the surrounding
      air. At sea level, air pressure is about 101.3 kPa, and water reaches that
      vapour pressure at 100°C.


      As you climb, there is less air above you, so atmospheric pressure drops.
      Water then needs less heat to reach a vapour pressure that matches it, so it
      boils at a lower temperature. In Denver, at about 1,600 metres, water boils
      at roughly 95°C.


      On the summit of Everest, at about 8,849 metres, air pressure is only about a
      third of sea-level pressure, and water boils at around 50°C. That is why
      food cooked by boiling takes much longer at altitude: the water simply cannot
      get as hot. Mountaineers and people living at high altitude often use
      pressure cookers, which raise the pressure inside the pot and therefore the
      boiling point.
    planted:
      - type: factual
        span: "boils at around 50°C"
        description: "Water boils at roughly 70°C on the summit of Everest, not 50°C."

  - id: adult-bone-count
    status: ready
    tags: [wrong-number, domain-health]
    question: |
      How many bones does the human body have, and why do babies have more?
    output: >
      An adult human skeleton typically has 212 bones, although the exact number
      varies slightly between people because of extra small sesamoid bones or
      variations in the spine and feet.


      Newborns have roughly 270 to 300 bony elements. Many of these start as
      cartilage or as separate ossification centres that gradually fuse during
      childhood and adolescence. For example, the plates of the skull, separated in
      infancy by soft spots called fontanelles, fuse together; the five vertebrae
      of the sacrum fuse into a single bone; and the ends of long bones fuse to
      their shafts once growth plates close, usually by the early twenties.


      The largest bone in the body is the femur, in the thigh, and the smallest is
      the stapes, one of the three tiny bones in the middle ear.
    planted:
      - type: factual
        span: "typically has 212 bones"
        description: "An adult skeleton typically has 206 bones, not 212."

  - id: mortgage-total-interest
    status: ready
    tags: [wrong-number, subtle, domain-finance]
    question: |
      What's my monthly payment on a $200,000 30-year mortgage at 6%, and how much
      interest will I pay overall? How does a 15-year loan compare?
    output: >
      The standard formula is M = P × r × (1 + r)^n / ((1 + r)^n − 1), where P is
      the loan amount, r the monthly rate and n the number of payments. Here P =
      200,000, r = 0.06 / 12 = 0.005 and n = 360.


      That gives a monthly payment of about $1,199.10 (principal and interest
      only; taxes and insurance would be extra). Over 360 payments you would pay
      about $431,676 in total, which means total interest of about $131,676.


      Early payments are mostly interest. In the first month, interest is 0.5% of
      $200,000, which is $1,000, so only about $199.10 reduces the principal. The
      balance falls slowly at first and faster in later years.


      A 15-year loan at the same 6% rate would cost about $1,687.71 a month, roughly
      $489 more, but total interest would be only about $103,788. In practice
      15-year loans usually carry a slightly lower rate than 30-year loans, which
      widens the saving further.
    planted:
      - type: factual
        span: "total interest of about $131,676"
        description: "Total interest is about $231,676 ($431,676 paid minus the $200,000 principal), not $131,676."

