  # ---------------------------------------------------------------------------
  # EXAMPLE 1 — two span issues of different types (factual + logic contradiction).
  # Written by Claude as a FORMAT EXAMPLE: review it, then set status: ready to keep
  # it in the eval, or delete it.
  # ---------------------------------------------------------------------------
  - id: example-sky-colour
    status: draft
    tags: [example, domain-science, wrong-number, contradiction, mixed]
    question: |
      Why is the sky blue during the day, and why do sunsets look orange or red?
    output: >
      The sky looks blue because of Rayleigh scattering. Sunlight contains all visible
      wavelengths, and as it passes through the atmosphere it meets gas molecules that are
      much smaller than the wavelength of the light. These molecules scatter shorter
      wavelengths far more strongly than longer ones — the effect scales with the inverse
      fourth power of the wavelength — so blue light, at around 650 nanometers, is scattered
      across the whole sky and reaches our eyes from every direction. At sunset, sunlight
      has to travel through much more atmosphere to reach you. Because red light scatters
      the most, the red light is spread out along this long path while the blue light comes
      straight through, which is why sunsets look orange and red.
    planted:
      # Planted wrong number: blue light is roughly 450-495 nm; ~650 nm is red.
      - type: factual
        span: "at around 650 nanometers"
        description: "Blue light is about 450-495 nm; 650 nm is red light."
      # Planted contradiction: the text first says SHORTER wavelengths (blue) scatter more,
      # then explains sunsets by saying RED scatters the most. Span = the second claim.
      - type: logic
        span: "Because red light scatters the most"
        description: >-
          Contradicts the earlier statement that shorter wavelengths scatter more strongly;
          sunsets are red because blue is scattered OUT of the long path, leaving red.
    notes: >-
      The contradiction is also factually wrong, so a factual critic may catch it too —
      that still counts as a catch (span overlap is type-agnostic for factual/logic).

  # ---------------------------------------------------------------------------
  # EXAMPLE 2 — completeness: answers the first part well, skips the second part
  # (the actual decision the user asked for). Note: no span, `missing` + `anchor`.
  # ---------------------------------------------------------------------------
  - id: example-roth-vs-traditional
    status: draft
    tags: [example, domain-finance, skipped-part, missed-point]
    question: |
      I'm deciding between a Roth IRA and a traditional IRA. How is each one taxed, and
      which is usually the better choice for someone who expects to be in a higher tax
      bracket in retirement?
    output: >
      With a traditional IRA, contributions may be tax-deductible, depending on your income
      and whether you are covered by a workplace retirement plan. The investments grow
      tax-deferred, and withdrawals in retirement are taxed as ordinary income. A Roth IRA
      works the other way around: contributions are made with after-tax dollars and are not
      deductible, but the money grows tax-free and qualified withdrawals in retirement are
      not taxed at all. Both accounts have annual contribution limits set by the IRS, and
      both generally charge a 10% penalty on early withdrawals before age 59½, with some
      exceptions. The right account depends on your personal circumstances, so it is worth
      reviewing your options carefully.
    planted:
      - type: completeness
        missing: >-
          A recommendation for someone expecting a higher tax bracket in retirement — usually
          the Roth IRA, because paying tax now at the lower rate beats paying it later at the
          higher rate.
        anchor: "The right account depends on your personal circumstances, so it is worth reviewing your options carefully."
    notes: >-
      The anchor is the vague closing sentence where the recommendation should have been.
      The taxation part is deliberately correct so the only problem is the omission.

  # ---------------------------------------------------------------------------
  # EXAMPLE 3 — clean case: accurate, complete, well-reasoned. Empty answer key.
  # Any issue a system raises here counts as a false flag.
  # ---------------------------------------------------------------------------
  - id: example-list-vs-tuple
    status: draft
    tags: [example, domain-programming, clean]
    question: |
      In Python, what is the difference between a list and a tuple, and when would you
      choose a tuple?
    output: >
      The main difference is mutability. A list is mutable: you can append, remove, or
      change its elements after it is created. A tuple is immutable: once it is created, its
      elements cannot be reassigned, added, or removed. Because of this, a tuple whose
      elements are all hashable is itself hashable, so it can be used as a dictionary key or
      stored in a set, which a list cannot. Tuples are also slightly more memory-efficient,
      and their immutability tells readers that the collection is not meant to change.

      Choose a tuple for a fixed group of related values — such as an (x, y) coordinate, a
      database row, or several values returned from a function — and for anything that needs
      to be a dictionary key. Choose a list for a collection of similar items whose size or
      contents will change, like a queue of tasks or results you are accumulating.
    planted: []

