  - id: clean-boiled-eggs
    status: ready
    tags: [clean, domain-everyday]
    question: |
      How long should I boil eggs for soft, jammy and hard yolks, and how do I make
      them easier to peel?
    output: >
      For large eggs straight from the fridge, lowered gently into water that is
      already at a rolling boil:


      About 6 minutes gives a set white and a runny yolk. About 7 minutes gives a
      jammy yolk that is soft and slightly sticky in the centre. Around 10 to 12
      minutes gives a fully set, hard-boiled yolk.


      As soon as the time is up, move the eggs into a bowl of ice water for a few
      minutes. This stops the cooking and makes the shells easier to remove. It
      also helps prevent the greenish-grey ring around the yolk, which is iron
      sulfide that forms when eggs are overcooked.


      For easier peeling, eggs that are a week or two old usually peel better than
      very fresh ones. As an egg ages, carbon dioxide escapes through the shell,
      the white becomes more alkaline, and it sticks less to the inner membrane.
      Starting eggs in boiling water rather than cold water also tends to help.
      Crack the shell all over and peel under running water, starting from the
      wider end where the air pocket is.


      Adjust timings slightly for egg size, altitude, and how many eggs you add at
      once, since a crowded pan takes longer to return to the boil.
    planted: []

  - id: clean-binary-search
    status: ready
    tags: [clean, domain-programming]
    question: |
      How does binary search work, and how fast is it?
    output: >
      Binary search finds a target value in a sorted array by repeatedly halving
      the range that could contain it. You compare the target with the middle
      element. If they are equal, you are done. If the target is smaller, you
      continue in the left half; if larger, in the right half. You stop when the
      range is empty, which means the value is not present.


      Because each step halves the remaining range, the worst-case number of
      comparisons grows logarithmically, so the time complexity is O(log n). For
      an array of 1,000,000 elements, binary search needs at most 20 comparisons,
      because 2^20 = 1,048,576. A linear search might need up to 1,000,000.


      The iterative version uses O(1) extra space, while a naive recursive version
      uses O(log n) stack space.


      Two practical caveats. First, the array must be sorted; if you have to sort
      it first, that costs O(n log n), which only pays off if you search many
      times. Second, in languages with fixed-width integers, computing the middle
      index as (low + high) / 2 can overflow for very large arrays. Writing it as
      low + (high - low) / 2 avoids that. Python's arbitrary-precision integers
      don't have this problem, and its standard library already provides binary
      search in the bisect module.
    planted: []

  - id: clean-rates-inflation
    status: ready
    tags: [clean, domain-finance]
    question: |
      Why do central banks raise interest rates to fight inflation?
    output: >
      Inflation is a sustained rise in the general price level, often because
      total demand in the economy is outrunning what it can produce. Raising the
      policy interest rate is meant to cool that demand.


      When a central bank raises its policy rate, commercial banks' borrowing
      costs rise, and they pass that on through higher rates on mortgages,
      business loans and credit cards. Borrowing becomes more expensive, so
      households and firms take on less debt, spend less, and postpone
      investment. Saving becomes more attractive at the same time. Higher rates
      also tend to strengthen the currency, which makes imports cheaper.


      With less spending, businesses face less pressure to raise prices, and a
      cooler labour market eases wage growth, so inflation gradually slows.
      Expectations matter too: if people believe the central bank will keep
      inflation under control, they are less likely to demand large pay rises or
      set large price increases in anticipation.


      There are two important caveats. Monetary policy works with what Milton
      Friedman called long and variable lags, often a year or more, so central
      banks must act on forecasts rather than current data. And raising rates too
      far or too fast can tip the economy into recession. What matters for
      borrowers is the real interest rate, roughly the nominal rate minus
      inflation, which is why a 5% rate is restrictive when inflation is 2% but
      not when inflation is 8%.
    planted: []

