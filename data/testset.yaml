    status: ready
    tags: [ignored-constraint, domain-programming]
    question: |
      Explain the difference between TCP and UDP using a real-world analogy.
    output: >
      TCP (Transmission Control Protocol) is connection-oriented. Before sending
      data, the two sides set up a connection with a three-way handshake. TCP
      numbers every segment, acknowledges what arrives, retransmits anything that
      is lost, and delivers data to the application in the original order. It
      also includes flow control and congestion control so a sender does not
      overwhelm the receiver or the network. The cost is extra overhead and
      latency.


      UDP (User Datagram Protocol) is connectionless. It sends independent
      datagrams with a minimal header and no handshake, acknowledgements,
      retransmission or ordering. Packets can arrive late, out of order, or not at
      all, and it is up to the application to cope.


      TCP suits anything where every byte must arrive intact, such as web pages,
      email and file transfers. UDP suits applications where speed matters more
      than perfect delivery, such as live video calls, online games and most DNS
      lookups. Notably, HTTP/3 runs over QUIC, which is built on UDP and
      implements its own reliability on top.
    planted:
      - type: completeness
        missing: "A real-world analogy for the TCP/UDP difference (e.g. registered mail vs postcards), which the question explicitly required."
        anchor: "TCP (Transmission Control Protocol) is connection-oriented."

