  - id: tomato-fruit-contradiction
    status: ready
    tags: [contradiction, domain-science]
    question: |
      Is a tomato a fruit or a vegetable?
    output: >
      Botanically, a tomato is a fruit. In botany, a fruit is the structure that
      develops from the ovary of a flowering plant after pollination and contains
      the seeds, and a tomato fits that definition exactly. By the same logic,
      cucumbers, peppers, aubergines and pumpkins are botanical fruits too.


      In cooking, though, tomatoes are treated as vegetables because they are
      savoury rather than sweet and are used in main dishes and salads rather than
      desserts. The US Supreme Court even ruled in Nix v. Hedden (1893) that
      tomatoes should be taxed as vegetables under tariff law, based on how people
      commonly used them.


      So, strictly in the botanical sense, tomatoes are classified as vegetables
      because they grow from the plant's flower. Which label is right depends on
      whether you are talking about plant biology or the kitchen.
    planted:
      - type: logic
        span: "So, strictly in the botanical sense, tomatoes are classified as vegetables because they grow from the plant's flower."
        description: "Contradicts the earlier, correct statement that botanically a tomato is a fruit precisely because it develops from the flower's ovary."

  - id: roth-ira-contradiction
    status: ready
    tags: [contradiction, domain-finance]
    question: |
      What's the difference between a Roth IRA and a traditional IRA?
    output: >
      The core difference is when you pay tax.


      With a traditional IRA, contributions are often tax-deductible, depending on
      your income and whether you have a workplace retirement plan, so they can
      lower your taxable income in the year you contribute. The money grows
      tax-deferred, and withdrawals in retirement are taxed as ordinary income.
      You must also begin required minimum distributions in your seventies.


      With a Roth IRA, you contribute money you have already paid tax on, so there
      is no deduction up front. In exchange, the account grows tax-free and
      qualified withdrawals in retirement, after age 59½ and once the account has
      been open at least five years, are completely tax-free. Roth IRAs have no
      required minimum distributions for the original owner, and eligibility to
      contribute directly phases out at higher incomes.


      The big advantage of the Roth is that your contributions lower your taxable
      income this year, while the traditional IRA's advantage comes later. As a
      rule of thumb, a Roth tends to suit people who expect to be in a higher tax
      bracket in retirement, and a traditional IRA suits those who expect a lower
      one.
    planted:
      - type: logic
        span: "The big advantage of the Roth is that your contributions lower your taxable income this year"
        description: "Contradicts the earlier correct statement that Roth contributions are made with after-tax money and get no up-front deduction; it is the traditional IRA that lowers current taxable income."

  - id: list-dict-key-contradiction
    status: ready
    tags: [contradiction, subtle, domain-programming]
    question: |
      When should I use a list versus a tuple in Python?
    output: >
      The key difference is mutability. A list is mutable: you can append, remove
      and change elements in place. A tuple is immutable: once created, its
      elements cannot be reassigned.


      That difference has practical consequences. Because tuples are immutable,
      a tuple is hashable as long as all of its elements are hashable, so tuples
      can be used as dictionary keys and stored in sets. Lists are unhashable, so
      they cannot be used as dictionary keys or set members.


      Use a list for a collection of similar items that may grow or change, such as
      a list of user IDs you are building up. Use a tuple for a fixed group of
      related values, often of different types, such as a (latitude, longitude)
      pair or a row returned from a database. For a composite dictionary key, such
      as a (city, year) pair, a list works just as well as a tuple. Tuples are also
      slightly smaller in memory and signal to readers that the data is not meant
      to change. If you need a fixed record with named fields, consider
      collections.namedtuple or a dataclass.
    planted:
      - type: logic
        span: "For a composite dictionary key, such as a (city, year) pair, a list works just as well as a tuple."
        description: "Contradicts the earlier, correct statement that lists are unhashable and cannot be dictionary keys."

