  - id: newton-laws-mixed
    status: ready
    tags: [mixed, wrong-date, contradiction, domain-science]
    question: |
      Explain Newton's three laws of motion and give an everyday example of the
      third law.
    output: >
      Isaac Newton set out his three laws of motion in the Principia, published in
      1667.


      The first law, the law of inertia, says that an object stays at rest or
      keeps moving in a straight line at constant speed unless a net external
      force acts on it. That is why a ball rolling across a flat floor eventually
      stops on its own: moving objects naturally lose their motion even when no
      force acts on them.


      The second law relates force, mass and acceleration: F = ma. The same force
      produces a smaller acceleration on a heavier object, which is why it takes
      more effort to push a loaded shopping trolley than an empty one.


      The third law says that for every action there is an equal and opposite
      reaction: when one object exerts a force on another, the second exerts a
      force of equal size in the opposite direction on the first. An everyday
      example is swimming. Your hands and feet push water backwards, and the water
      pushes you forwards with an equal force. Rockets work the same way, pushing
      exhaust gases out of the back and being pushed forward in return.
    planted:
      - type: factual
        span: "published in 1667"
        description: "Newton's Principia was published in 1687, not 1667."
      - type: logic
        span: "moving objects naturally lose their motion even when no force acts on them"
        description: "Contradicts the first law just stated; the ball stops because friction and air resistance act on it, not because objects slow down without a force."

  - id: process-thread-mixed
    status: ready
    tags: [mixed, wrong-claim, skipped-part, domain-programming]
    question: |
      Explain the difference between a process and a thread, and give one
      advantage of each.
    output: >
      A process is an instance of a running program that the operating system
      schedules and manages, together with resources such as open file handles.
      A thread is a single sequence of execution within a process. Every process
      has at least one thread, and many have several.


      Threads in the same process share its heap, global variables and open files,
      but each thread has its own stack and its own register state, including the
      program counter. By default, separate processes share the same address
      space, which is why they can read each other's variables directly.


      An advantage of threads is that they are cheap to create and switch between
      compared with processes, and because they share memory they can exchange data
      quickly without copying it. The trade-off is that shared memory makes race
      conditions possible, so access to shared data usually needs locks or other
      synchronisation.
    planted:
      - type: factual
        span: "By default, separate processes share the same address space"
        description: "By default each process has its own separate address space; processes cannot read each other's variables directly and must use inter-process communication or explicitly shared memory."
      - type: completeness
        missing: "An advantage of processes (e.g. isolation: a crash or memory corruption in one process does not bring down others; in CPython, separate processes also avoid the GIL)."
        anchor: "An advantage of threads is that they are cheap to create"

  - id: index-fund-mixed
    status: ready
    tags: [mixed, wrong-name, wrong-number, unsupported-conclusion, domain-finance]
    question: |
      What is an index fund, what does it typically cost, and what's the main risk?
    output: >
      An index fund is a mutual fund or exchange-traded fund that aims to match the
      performance of a market index, such as the S&P 500, by holding the same
      securities in the same proportions, rather than trying to pick winners. The
      idea was popularised for ordinary investors by John Bogle, who founded
      Fidelity in 1975 and launched the first index mutual fund for retail
      investors the following year.


      Because there is no team of analysts picking stocks and trading is minimal,
      costs are low. Broad index funds typically charge around 1.5% a year, far
      less than many actively managed funds.


      The main risk is market risk: an index fund rises and falls with the market
      it tracks. The S&P 500 fell by roughly 57% from its peak in October 2007 to
      its low in March 2009, and an S&P 500 index fund fell with it. Because an
      index fund holds hundreds of companies, it can't lose money over any
      five-year period, so it is a safe place for money you need next year.
    planted:
      - type: factual
        span: "Fidelity in 1975"
        description: "John Bogle founded Vanguard in 1975, not Fidelity."
      - type: factual
        span: "typically charge around 1.5% a year"
        description: "Broad index funds typically charge well under 0.2% a year; the cheapest S&P 500 funds charge around 0.03% or less."
      - type: logic
        span: "Because an index fund holds hundreds of companies, it can't lose money over any five-year period"
        description: "Diversification across companies does not remove market risk; the answer's own 2007–2009 example shows a broad index fund can lose heavily, so the conclusion (and the 'safe for money you need next year' advice) does not follow."
