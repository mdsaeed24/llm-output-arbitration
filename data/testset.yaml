  - id: recursion-example-ignored
    status: ready
    tags: [ignored-constraint, domain-programming]
    question: |
      Explain recursion and give a code example.
    output: >
      Recursion is a technique in which a function solves a problem by calling
      itself on a smaller version of the same problem. Every recursive function
      needs two parts. The base case is a condition simple enough to answer
      directly, without recursion; it is what stops the process. The recursive
      case breaks the problem into a smaller subproblem, calls the function on
      it, and combines the result.


      Each call is placed on the call stack with its own local variables. When the
      base case is reached, the calls return one by one, in reverse order, and the
      results are combined on the way back up. If the base case is missing or
      never reached, the calls pile up until the program runs out of stack space;
      in Python this raises a RecursionError, by default after about 1,000 levels.


      Recursion is a natural fit for problems with a self-similar structure, such
      as traversing trees and nested folders, parsing nested expressions, and
      divide-and-conquer algorithms like merge sort. Any recursive function can be
      rewritten iteratively, which is sometimes more efficient, but the recursive
      version is often shorter and closer to how the problem is defined.
    planted:
      - type: completeness
        missing: "A code example of a recursive function, which the question explicitly asked for."
        anchor: "Recursion is a technique in which a function solves a problem by calling itself"

