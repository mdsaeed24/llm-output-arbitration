  - id: english-science-circular
    status: ready
    tags: [circular, domain-history]
    question: |
      Why is English the main language of science?
    output: >
      It wasn't always. Latin was the shared language of European scholarship into
      the 18th century, and in the early 20th century much important science was
      published in German and French, with German especially strong in chemistry
      and physics.


      Several 20th-century events shifted the balance. After the First World War,
      German and Austrian scientists were excluded from many international
      scientific organisations and conferences for years. In the 1930s, Nazi
      persecution drove many leading scientists to emigrate, a large number of
      them to the United States and Britain. After the Second World War, the
      United States became the world's largest funder of research, and its
      universities, journals and citation databases became central to
      international science.


      And the reason researchers around the world choose to publish in English is
      simply that English is the language of science.


      Today the most-cited journals publish mainly in English, so researchers who
      want international visibility have strong incentives to use it, which
      further reinforces its position.
    planted:
      - type: logic
        span: "the reason researchers around the world choose to publish in English is simply that English is the language of science"
        description: "Circular: it explains English's status as the language of science by asserting that English is the language of science."

  - id: unit-tests-circular
    status: ready
    tags: [circular, subtle, domain-programming]
    question: |
      Why should my team bother writing unit tests?
    output: >
      Unit tests pay off in several concrete ways. They catch regressions: when a
      change breaks existing behaviour, a failing test tells you immediately
      instead of a customer telling you weeks later. They make refactoring safer,
      because you can restructure code and confirm it still behaves the same. They
      document intended behaviour in an executable form that, unlike comments,
      cannot silently go out of date. And they give fast feedback, often in
      seconds, compared with manual testing.


      Writing tests also tends to improve design. Code that is hard to test is
      often too tightly coupled, so the act of testing pushes you towards smaller,
      more focused functions with clear inputs and outputs.


      Ultimately, unit testing is a best practice because experienced teams adopt
      it, and teams count as experienced precisely because they follow best
      practices like unit testing.


      Start with the code that changes most often or breaks most expensively, keep
      tests fast and independent, and run them automatically on every commit.
    planted:
      - type: logic
        span: "teams count as experienced precisely because they follow best practices like unit testing"
        description: "Circular: unit testing is justified by experienced teams adopting it, and teams are defined as experienced by their adopting practices like unit testing."

