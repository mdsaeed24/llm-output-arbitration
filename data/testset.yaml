  - id: clean-photosynthesis
    status: ready
    tags: [clean, domain-science]
    question: |
      Explain how photosynthesis works and where in the plant cell it happens.
    output: >
      Photosynthesis is the process by which plants, algae and cyanobacteria
      convert light energy into chemical energy stored in sugars. In plants it
      takes place inside chloroplasts, mostly in the mesophyll cells of the leaf.


      It happens in two linked stages. The light-dependent reactions occur in the
      thylakoid membranes. Chlorophyll and other pigments absorb light, which
      drives the splitting of water molecules. This releases oxygen as a
      by-product and produces two energy carriers, ATP and NADPH.


      The light-independent reactions, known as the Calvin cycle, take place in
      the stroma, the fluid surrounding the thylakoids. Here the enzyme RuBisCO
      fixes carbon dioxide from the air, and the ATP and NADPH from the first
      stage are used to reduce it into a three-carbon sugar, G3P. Some G3P is used
      to build glucose and other carbohydrates; the rest regenerates the starting
      molecule so the cycle can continue.


      The overall equation is 6CO2 + 6H2O + light energy → C6H12O6 + 6O2. One
      detail people often get wrong: the oxygen released comes from the water,
      not from the carbon dioxide. This was confirmed by isotope-labelling
      experiments with oxygen-18 in the early 1940s.
    planted: []

  - id: clean-french-revolution
    status: ready
    tags: [clean, domain-history]
    question: |
      What were the main causes of the French Revolution, and how did it begin?
    output: >
      The French Revolution grew out of a mix of financial, social and
      intellectual pressures.


      Financial crisis. By the 1780s the French crown was close to bankruptcy.
      Decades of war, including the Seven Years' War and France's costly support
      for the American Revolution, had left enormous debts, and interest payments
      consumed a large share of royal revenue. Attempts by ministers such as
      Calonne and Brienne to reform taxation were blocked by the privileged
      orders.


      Social inequality. Society was divided into three estates: the clergy, the
      nobility and everyone else. The first two enjoyed major tax exemptions, so
      the burden fell heavily on the Third Estate, which included peasants, urban
      workers and an increasingly wealthy and frustrated bourgeoisie.


      Economic hardship. A poor harvest in 1788 pushed bread prices sharply higher
      in 1789, at a time when bread made up a large part of ordinary people's
      spending. Hunger made urban crowds volatile.


      Enlightenment ideas. Writers such as Rousseau, Voltaire and Montesquieu had
      spread ideas about popular sovereignty, the separation of powers and the
      criticism of arbitrary authority, giving reformers a language with which to
      challenge the old order.


      How it began. To resolve the fiscal crisis, Louis XVI summoned the
      Estates-General, which met at Versailles in May 1789 for the first time
      since 1614. Disputes over voting procedure led the Third Estate to declare
      itself the National Assembly on 17 June. Locked out of their usual hall
      three days later, the deputies swore the Tennis Court Oath on 20 June,
      promising not to disband until France had a constitution. Fears that the
      king would use troops against the Assembly, combined with high bread prices,
      led Parisians to storm the Bastille on 14 July 1789. In August the Assembly
      abolished feudal privileges and adopted the Declaration of the Rights of Man
      and of the Citizen.
    planted: []

  - id: clean-python-mutable-default
    status: ready
    tags: [clean, domain-programming]
    question: |
      Why does my Python function keep remembering items from previous calls?

          def add_item(item, items=[]):
              items.append(item)
              return items
    output: |
      Because default argument values are evaluated once, when the `def` statement
      runs, not each time the function is called. Every call that doesn't pass
      `items` gets the same list object, so appends accumulate:

          >>> add_item("a")
          ['a']
          >>> add_item("b")
          ['a', 'b']

      The standard fix is to use `None` as a sentinel and create a new list inside
      the function:

          def add_item(item, items=None):
              if items is None:
                  items = []
              items.append(item)
              return items

      Now each call without an explicit list gets a fresh one. The same issue
      applies to any mutable default: dicts, sets, or custom objects. Immutable
      defaults such as numbers, strings, tuples or None are safe because they
      can't be changed in place. You can see the shared object directly:
      `add_item.__defaults__` holds the list that is being reused.
    planted: []

  - id: clean-compound-interest
    status: ready
    tags: [clean, domain-finance]
    question: |
      If I invest $10,000 at 6% per year compounded annually, how much will I have
      after 10 years, and how does that compare with simple interest?
    output: >
      With annual compounding, the future value is P × (1 + r)^n = 10,000 × 1.06^10.
      Since 1.06^10 ≈ 1.7908, you would have about $17,908.48 after 10 years, of
      which $7,908.48 is interest.


      With simple interest, you earn 6% of the original $10,000 every year, which
      is $600 a year, or $6,000 over 10 years, for a total of $16,000.


      Compounding therefore adds $1,908.48 more than simple interest, because from
      the second year onward you also earn interest on interest already credited.
      The gap widens the longer the money is invested.


      A quick check is the Rule of 72: 72 ÷ 6 = 12, so money at 6% roughly doubles
      in about 12 years. The exact figure is ln 2 ÷ ln 1.06 ≈ 11.9 years, which is
      consistent with having about 1.79× your money after 10 years. If the same 6%
      were compounded monthly (0.5% per month for 120 months), the balance would
      be slightly higher, at about $18,193.97.
    planted: []

  - id: clean-vitamin-d
    status: ready
    tags: [clean, domain-health]
    question: |
      What does vitamin D do, and how much do adults need?
    output: >
      Vitamin D is a fat-soluble vitamin whose main job is helping the body absorb
      calcium and phosphate from the gut, which is essential for building and
      maintaining healthy bones. It also plays roles in muscle function and the
      immune system.


      The body makes vitamin D in the skin when it is exposed to UVB light from
      the sun, so production depends on latitude, season, skin pigmentation, time
      outdoors and sunscreen use. Relatively few foods are naturally rich in it;
      the main ones are oily fish such as salmon, mackerel and sardines, plus egg
      yolks. Many countries also fortify milk, plant milks and breakfast cereals.


      Severe deficiency causes rickets in children, where bones soften and
      deform, and osteomalacia in adults, which causes bone pain and muscle
      weakness. Long-term insufficiency also contributes to osteoporosis risk.


      In the United States, the recommended dietary allowance is 600 IU (15
      micrograms) a day for people aged 1 to 70 and 800 IU (20 micrograms) a day
      for those over 70. The tolerable upper intake level for adults is 4,000 IU
      (100 micrograms) a day; regularly exceeding it from supplements can raise
      blood calcium to harmful levels. If you suspect a deficiency, a blood test
      for 25-hydroxyvitamin D is the standard way to check.
    planted: []

  - id: clean-sql-left-join
    status: ready
    tags: [clean, domain-programming]
    question: |
      What's the difference between INNER JOIN and LEFT JOIN, and why did my LEFT
      JOIN start dropping customers when I added a WHERE clause on the orders table?
    output: |
      An INNER JOIN returns only rows that have a match in both tables. A LEFT JOIN
      returns every row from the left table; where there is no match, the columns
      from the right table are filled with NULL.

      Your problem is a classic one. A query like this:

          SELECT c.name, o.id
          FROM customers c
          LEFT JOIN orders o ON o.customer_id = c.id
          WHERE o.status = 'shipped';

      applies the WHERE clause after the join. For customers with no orders,
      o.status is NULL, and NULL = 'shipped' evaluates to UNKNOWN rather than TRUE,
      so those rows are filtered out. The result behaves exactly like an INNER JOIN.

      If you want to keep every customer and only attach their shipped orders, move
      the condition into the ON clause:

          SELECT c.name, o.id
          FROM customers c
          LEFT JOIN orders o
            ON o.customer_id = c.id AND o.status = 'shipped';

      Now every customer appears, and those without a shipped order get NULL in
      o.id. If what you actually wanted was only customers who have shipped
      orders, write it as an INNER JOIN so the intent is obvious to the next reader.
    planted: []

