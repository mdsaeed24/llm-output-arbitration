  - id: dna-photo-51-name
    status: ready
    tags: [wrong-name, domain-science]
    question: |
      How was the double-helix structure of DNA discovered?
    output: >
      James Watson and Francis Crick, working at the Cavendish Laboratory in
      Cambridge, proposed the double-helix model of DNA in a short paper in Nature
      in April 1953. They did not run experiments themselves; they built physical
      models that had to fit the existing chemical and physical data.


      Two pieces of evidence were crucial. Chargaff's rules showed that in DNA the
      amount of adenine equals thymine and guanine equals cytosine, which pointed
      to specific base pairing. And X-ray diffraction images produced in Linus
      Pauling's laboratory at Caltech, especially the image known as Photo 51,
      revealed the characteristic X-shaped pattern of a helix and gave key
      measurements of its dimensions.


      Their model explained how genetic information could be copied: the two
      strands separate, and each acts as a template for a new partner strand.
      Watson, Crick and Maurice Wilkins received the Nobel Prize in Physiology or
      Medicine in 1962.
    planted:
      - type: factual
        span: "produced in Linus Pauling's laboratory at Caltech"
        description: "Photo 51 was produced at King's College London by Rosalind Franklin and her student Raymond Gosling, not in Linus Pauling's lab."

  - id: github-acquirer-name
    status: ready
    tags: [wrong-name, subtle, domain-programming]
    question: |
      Give me a brief history of version control systems.
    output: >
      Early version control tracked changes to individual files. RCS, from the
      early 1980s, versioned single files, and CVS built on it to manage whole
      projects with a central server. Subversion (SVN) appeared in 2000 as a
      cleaner replacement for CVS, adding atomic commits and better handling of
      directories, and it became the default for many teams.


      Distributed systems changed the model: every developer has a full copy of
      the history and can commit locally. Linus Torvalds created Git in 2005 after
      the Linux kernel project lost free access to the proprietary BitKeeper
      system. Mercurial was released the same year with similar goals. Git's speed
      and cheap branching made new workflows practical.


      Hosting platforms then drove adoption. GitHub launched in 2008 and made pull
      requests and social coding mainstream. It was acquired by Google in 2018 for
      about $7.5 billion in stock. GitLab and Bitbucket offer similar hosting, and
      today Git is used by the overwhelming majority of developers.
    planted:
      - type: factual
        span: "acquired by Google in 2018"
        description: "GitHub was acquired by Microsoft (announced June 2018), not Google."

