[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "LLM Output Arbitration: multi-provider critic agents + adjudicator, benchmarked against a single-reviewer baseline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "openai>=2.0,<4",
    "langgraph>=1.2,<2",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "fastapi>=0.140,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.60,<2",
    "pandas>=2.2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
